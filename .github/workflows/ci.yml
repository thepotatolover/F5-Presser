name: 🚀 CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'release/**' ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Python version to test'
        required: false
        default: '3.11'
        type: choice
        options:
          - '3.8'
          - '3.9'
          - '3.10'
          - '3.11'
          - '3.12'

env:
  PYTHON_VERSION: '3.11'

jobs:
  # Code Quality Checks
  lint:
    name: 🔍 Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    
    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install flake8 black isort mypy
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
    
    - name: 🎨 Check code formatting with Black
      run: |
        black --check --diff .
      continue-on-error: true
    
    - name: 📋 Check import sorting with isort
      run: |
        isort --check-only --diff .
      continue-on-error: true
    
    - name: 🔎 Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics
    
    - name: 🔬 Type checking with mypy
      run: |
        mypy . --ignore-missing-imports || true
      continue-on-error: true

  # Security Scanning
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v6
    
    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: 🔐 Run Bandit security scan
      run: |
        pip install bandit[toml]
        bandit -r . -f json -o bandit-report.json || true
        bandit -r . || true
      continue-on-error: true
    
    - name: 📊 Upload security report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-report
        path: bandit-report.json
        retention-days: 7

  # Cross-platform Testing
  test:
    name: 🧪 Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
        exclude:
          # Reduce matrix size for faster CI
          - os: macos-latest
            python-version: '3.8'
          - os: macos-latest
            python-version: '3.9'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v6
    
    - name: 🐍 Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: ✅ Verify imports
      run: |
        python -c "from pynput.keyboard import Key, Controller; import time; print('✅ Imports successful')"
    
    - name: 🔍 Syntax check
      run: |
        python -m py_compile main.py
        echo "✅ Syntax check passed"
    
    - name: 📊 Test execution (dry run)
      run: |
        timeout 10 python main.py || echo "Script runs correctly (timeout expected)"
      continue-on-error: true

  # Build Check
  build:
    name: 📦 Build Check
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 10
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v6
    
    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: 📦 Install build tools
      run: |
        python -m pip install --upgrade pip build twine
    
    - name: 🔨 Build package
      run: |
        python -m build
      continue-on-error: true
    
    - name: 📤 Upload build artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: dist-packages
        path: dist/
        retention-days: 7

  # Summary
  ci-summary:
    name: 📊 CI Summary
    runs-on: ubuntu-latest
    needs: [lint, security, test, build]
    if: always()
    
    steps:
    - name: ✅ CI Pipeline Complete
      run: |
        echo "🎉 CI Pipeline completed!"
        echo "Lint: ${{ needs.lint.result }}"
        echo "Security: ${{ needs.security.result }}"
        echo "Test: ${{ needs.test.result }}"
        echo "Build: ${{ needs.build.result }}"
