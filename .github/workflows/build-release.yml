name: 🔨 Build & Release Executable

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: false
        type: string
      build_windows:
        description: 'Build Windows executable'
        required: false
        default: true
        type: boolean
      build_macos:
        description: 'Build macOS executable'
        required: false
        default: false
        type: boolean
      build_linux:
        description: 'Build Linux executable'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.11'

jobs:
  build-windows:
    name: 🔨 Build Windows Executable
    runs-on: windows-latest
    if: github.event.inputs.build_windows != 'false' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v6
    
    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: 📦 Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: 🔨 Build executable with PyInstaller
      shell: bash
      run: |
        pyinstaller --onefile --name "F5-Presser" --clean --noconsole main.py
    
    - name: 📦 Prepare artifact
      shell: bash
      run: |
        cd dist
        echo "Built executable: F5-Presser.exe"
        ls -lh F5-Presser.exe
    
    - name: 📤 Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: F5-Presser-Windows
        path: dist/F5-Presser.exe
        retention-days: 30
  
  build-macos:
    name: 🔨 Build macOS Executable
    runs-on: macos-latest
    if: github.event.inputs.build_macos == 'true' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v6
    
    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: 📦 Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: 🔨 Build executable with PyInstaller
      shell: bash
      run: |
        pyinstaller --onefile --name "F5-Presser" --clean main.py
    
    - name: 📦 Prepare artifact
      shell: bash
      run: |
        cd dist
        chmod +x F5-Presser
        echo "Built executable: F5-Presser"
        ls -lh F5-Presser
    
    - name: 📦 Create DMG package
      shell: bash
      run: |
        # Create DMG directory structure
        mkdir -p dmg_package
        cp dist/F5-Presser dmg_package/
        chmod +x dmg_package/F5-Presser
        
        # Create a temporary read-write DMG
        TEMP_DMG="temp_f5_presser.dmg"
        hdiutil create -srcfolder dmg_package -volname "F5 Presser" -fs HFS+ -fsargs "-c c=64,a=16,e=16" -format UDRW -size 50m "$TEMP_DMG"
        
        # Mount the DMG
        DEVICE=$(hdiutil attach -readwrite -noverify -noautoopen "$TEMP_DMG" | egrep '^/dev/' | sed 1q | awk '{print $1}')
        MOUNT_POINT="/Volumes/F5 Presser"
        
        # Wait for mount to complete
        sleep 2
        
        # Create Applications symlink
        ln -s /Applications "$MOUNT_POINT/Applications" || true
        
        # Set window properties using AppleScript
        printf 'tell application "Finder"\n' > /tmp/set_dmg_layout.scpt
        printf '  tell disk "F5 Presser"\n' >> /tmp/set_dmg_layout.scpt
        printf '    open\n' >> /tmp/set_dmg_layout.scpt
        printf '    set current view of container window to icon view\n' >> /tmp/set_dmg_layout.scpt
        printf '    set toolbar visible of container window to false\n' >> /tmp/set_dmg_layout.scpt
        printf '    set statusbar visible of container window to false\n' >> /tmp/set_dmg_layout.scpt
        printf '    set the bounds of container window to {400, 100, 920, 420}\n' >> /tmp/set_dmg_layout.scpt
        printf '    set viewOptions to the icon view options of container window\n' >> /tmp/set_dmg_layout.scpt
        printf '    set arrangement of viewOptions to not arranged\n' >> /tmp/set_dmg_layout.scpt
        printf '    set icon size of viewOptions to 72\n' >> /tmp/set_dmg_layout.scpt
        printf '    set position of item "F5-Presser" of container window to {160, 205}\n' >> /tmp/set_dmg_layout.scpt
        printf '    set position of item "Applications" of container window to {360, 205}\n' >> /tmp/set_dmg_layout.scpt
        printf '    close\n' >> /tmp/set_dmg_layout.scpt
        printf '    update without registering applications\n' >> /tmp/set_dmg_layout.scpt
        printf '  end tell\n' >> /tmp/set_dmg_layout.scpt
        printf 'end tell\n' >> /tmp/set_dmg_layout.scpt
        osascript /tmp/set_dmg_layout.scpt 2>&1 || echo "⚠️  Window layout may not be configured"
        rm -f /tmp/set_dmg_layout.scpt
        echo "✅ Window layout configured"
        
        # Unmount the DMG
        hdiutil detach "$DEVICE" || true
        
        # Wait a moment for unmount to complete
        sleep 2
        
        # Convert to compressed read-only DMG
        hdiutil convert "$TEMP_DMG" -format UDZO -imagekey zlib-level=9 -o dist/F5-Presser.dmg
        
        # Cleanup
        rm -f "$TEMP_DMG"
        rm -rf dmg_package
        
        echo "✅ DMG created successfully"
        ls -lh dist/F5-Presser.dmg
    
    - name: 📤 Upload macOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: F5-Presser-macOS
        path: dist/F5-Presser.dmg
        retention-days: 30
  
  build-linux:
    name: 🔨 Build Linux Executable
    runs-on: ubuntu-latest
    if: github.event.inputs.build_linux == 'true' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v6
    
    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: 📦 Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: 🔨 Build executable with PyInstaller
      shell: bash
      run: |
        pyinstaller --onefile --name "F5-Presser" --clean main.py
    
    - name: 📦 Prepare artifact
      shell: bash
      run: |
        cd dist
        chmod +x F5-Presser
        echo "Built executable: F5-Presser"
        ls -lh F5-Presser
    
    - name: 📤 Upload Linux artifact
      uses: actions/upload-artifact@v4
      with:
        name: F5-Presser-Linux
        path: dist/F5-Presser
        retention-days: 30
  
  build:
    name: 🔨 Build Executables
    needs: [build-windows, build-macos, build-linux]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
    - name: ✅ Build jobs completed
      run: echo "Build jobs completed"

  release:
    name: 🚀 Create Release
    needs: [build-windows, build-macos, build-linux]
    if: always() && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    
    - name: 🏷️ Get version from tag or input
      id: get_version
      shell: bash
      run: |
        if [[ "${{ github.event_name }}" == "push" ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        else
          VERSION="${{ github.event.inputs.version }}"
          if [[ -z "$VERSION" ]]; then
            VERSION=$(date +%Y.%m.%d)
          fi
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "📌 Release version: $VERSION"
    
    - name: 📥 Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: 📋 Prepare release files
      shell: bash
      run: |
        mkdir -p release
        # Copy Windows executable
        if [ -f "artifacts/F5-Presser-Windows/F5-Presser.exe" ]; then
          cp artifacts/F5-Presser-Windows/F5-Presser.exe release/F5-Presser-Windows.exe
          echo "✅ Windows executable ready"
        fi
        # Copy macOS DMG
        if [ -f "artifacts/F5-Presser-macOS/F5-Presser.dmg" ]; then
          cp artifacts/F5-Presser-macOS/F5-Presser.dmg release/F5-Presser-macOS.dmg
          echo "✅ macOS DMG ready"
        fi
        # Copy Linux executable
        if [ -f "artifacts/F5-Presser-Linux/F5-Presser" ]; then
          cp artifacts/F5-Presser-Linux/F5-Presser release/F5-Presser-Linux
          chmod +x release/F5-Presser-Linux
          echo "✅ Linux executable ready"
        fi
        ls -lh release/
    
    - name: 📝 Generate release notes
      id: release_notes
      shell: bash
      run: |
        VERSION="${{ steps.get_version.outputs.version }}"
        NOTES="## 🎉 Release v${VERSION}
        
        ### 📦 Downloads
        
        "
        
        if [ -f "release/F5-Presser-Windows.exe" ]; then
          NOTES="${NOTES}- **Windows**: [F5-Presser-Windows.exe](https://github.com/thepotatolover/F5-Presser/releases/download/v${VERSION}/F5-Presser-Windows.exe)
        "
        fi
        
        if [ -f "release/F5-Presser-macOS.dmg" ]; then
          NOTES="${NOTES}- **macOS**: [F5-Presser-macOS.dmg](https://github.com/thepotatolover/F5-Presser/releases/download/v${VERSION}/F5-Presser-macOS.dmg)
        "
        fi
        
        if [ -f "release/F5-Presser-Linux" ]; then
          NOTES="${NOTES}- **Linux**: [F5-Presser-Linux](https://github.com/thepotatolover/F5-Presser/releases/download/v${VERSION}/F5-Presser-Linux)
        "
        fi
        
        NOTES="${NOTES}
        
        ### 📋 Changes
        
        See [CHANGELOG.md](https://github.com/thepotatolover/F5-Presser/blob/main/CHANGELOG.md) for details.
        
        ### 🚀 Usage
        
        **Windows:**
        1. Download F5-Presser-Windows.exe
        2. Run the executable
        3. The script will automatically press F5 at regular intervals
        
        **macOS:**
        1. Download F5-Presser-macOS.dmg
        2. Open the DMG file
        3. Drag F5-Presser to Applications (or run directly)
        4. Grant accessibility permissions in System Preferences if prompted
        5. Run the application
        
        **Linux:**
        1. Download F5-Presser-Linux
        2. Make it executable: \`chmod +x F5-Presser-Linux\`
        3. Run: \`./F5-Presser-Linux\`
        "
        
        echo "notes<<EOF" >> $GITHUB_OUTPUT
        echo "$NOTES" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
    
    - name: 🏷️ Create Git Tag (if manual dispatch)
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a "v${{ steps.get_version.outputs.version }}" -m "Release v${{ steps.get_version.outputs.version }}"
        git push origin "v${{ steps.get_version.outputs.version }}"
    
    - name: 📤 Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: release/*
        tag_name: v${{ steps.get_version.outputs.version }}
        name: Release v${{ steps.get_version.outputs.version }}
        body: ${{ steps.release_notes.outputs.notes }}
        draft: false
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
